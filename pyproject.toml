[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep_learning_stock_trading"
version = "0.1.0"
description = "DoubleAdapt + GRU + Alpha360 pipeline for TWSE virtual trading."
requires-python = ">=3.11"

# Runtime dependencies are managed via environment.yml (PyTorch needs an
# --extra-index-url that pyproject.toml can't express). This file exists
# only to register `src` as an importable package via `pip install -e .`.

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# Pylance / Pyright can't trace through setuptools' editable MetaPathFinder
# (used by `pip install -e ./thirdparty/stock_project_for_class`), so point it at the
# source directory directly to resolve `import stock_api`.
[tool.pyright]
extraPaths = ["./thirdparty/stock_project_for_class"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a model end to end (deselect with -m 'not slow')"]

# ---------------------------------------------------------------------------
# Lint — mirrors qlib's setup (thirdparty/qlib/.pre-commit-config.yaml,
# .mypy.ini and .github/workflows/test_qlib_from_source.yml).
# flake8 can't read pyproject.toml; its config is in .flake8.
# Run everything:  pre-commit run --all-files   (black + flake8)
#                  pylint src tests && mypy src
# ---------------------------------------------------------------------------

[tool.black]
line-length = 120
extend-exclude = "^/(thirdparty|data|models|logs)/"

[tool.pylint.main]
# qlib passes this via --init-hook so astroid can infer through deep torch/pandas code.
init-hook = "import astroid; astroid.context.InferenceContext.max_inferred = 500; import sys; sys.setrecursionlimit(2000)"
ignore-paths = ["^thirdparty/.*$"]

[tool.pylint.basic]
const-rgx = "[a-z_][a-z0-9_]{2,30}$"

[tool.pylint."messages control"]
# qlib's disable list, verbatim.
disable = [
    "C0104", "C0114", "C0115", "C0116", "C0301", "C0302", "C0411", "C0413", "C1802",
    "R0401", "R0801", "R0902", "R0903", "R0911", "R0912", "R0913", "R0914", "R0915", "R1720",
    "W0105", "W0123", "W0201", "W0511", "W0613", "W1113", "W1514",
    "E0401", "E1121", "C0103", "C0209",
    "R0402", "R1705", "R1710", "R1725", "R1735",
    "W0102", "W0212", "W0221", "W0223", "W0231", "W0237", "W0612", "W0621", "W0622", "W0703", "W1309",
    "E1102", "E1136",
    # Added: R0917 (too-many-positional-arguments) postdates qlib's list; it was split
    # out of R0913 (too-many-arguments), which qlib disables.
    "R0917",
]

[tool.mypy]
# Same flags as qlib's .mypy.ini.
ignore_missing_imports = true
disallow_incomplete_defs = true
follow_imports = "skip"
exclude = ["^thirdparty/"]
